# Saleor API — server.chapchapticket.com
#
# 1) Install (HTTP first — works before TLS):
#    sudo cp nginx/server.chapchapticket.com.conf /etc/nginx/sites-available/
#    sudo ln -sf /etc/nginx/sites-available/server.chapchapticket.com.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
# 2) Issue TLS:
#    sudo certbot --nginx -d server.chapchapticket.com
#
# Docker must publish the API on 127.0.0.1:8000
# Media/static under /home/vaflaly/chapchap/saleor/deployment/digitalocean/data/

upstream chapchap_saleor_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name server.chapchapticket.com;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /media/ {
        alias /home/vaflaly/chapchap/saleor/deployment/digitalocean/data/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        alias /home/vaflaly/chapchap/saleor/deployment/digitalocean/data/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /graphql {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_pass http://chapchap_saleor_api;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_pass http://chapchap_saleor_api;
    }
}
