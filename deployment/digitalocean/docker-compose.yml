# ChapChap Saleor — production stack for DigitalOcean
# Uses the EXISTING host Postgres DB `chapchap` (not a compose Postgres).
# Bind API only on localhost; host Nginx terminates TLS for server.chapchapticket.com
#
# Usage (on the droplet):
#   cd ~/chapchap/saleor/deployment/digitalocean
#   docker compose up -d --build

name: chapchap-saleor

x-saleor-app: &saleor-app
  image: chapchap-saleor:latest
  env_file:
    - .env
  environment:
    DATABASE_URL: ${DATABASE_URL}
    CELERY_BROKER_URL: ${CELERY_BROKER_URL}
    REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    CACHE_URL: ${CACHE_URL:-redis://redis:6379/0}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./secrets/rsa_private.pem:/run/secrets/rsa_private.pem:ro
    - ./secrets/rsa_public.pem:/run/secrets/rsa_public.pem:ro
  entrypoint: ["/bin/sh", "/app/deployment/digitalocean/scripts/entrypoint.sh"]

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *saleor-app
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/media:/app/media
      - ./secrets/rsa_private.pem:/run/secrets/rsa_private.pem:ro
      - ./secrets/rsa_public.pem:/run/secrets/rsa_public.pem:ro
    # 1 worker keeps RAM usable on a small droplet; raise to 2 on 4GB+
    command:
      [
        "uvicorn",
        "saleor.asgi:application",
        "--host=0.0.0.0",
        "--port=8000",
        "--workers=1",
        "--lifespan=off",
        "--ws=none",
        "--no-server-header",
        "--no-access-log",
        "--timeout-keep-alive=35",
        "--timeout-graceful-shutdown=30",
        "--limit-max-requests=5000",
      ]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *saleor-app
    restart: unless-stopped
    volumes:
      - ./data/media:/app/media
      - ./secrets/rsa_private.pem:/run/secrets/rsa_private.pem:ro
      - ./secrets/rsa_public.pem:/run/secrets/rsa_public.pem:ro
    command:
      [
        "celery",
        "--app=saleor.celeryconf:app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "-E",
      ]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  beat:
    <<: *saleor-app
    restart: unless-stopped
    command:
      [
        "celery",
        "--app=saleor.celeryconf:app",
        "beat",
        "--scheduler=saleor.schedulers.schedulers.DatabaseScheduler",
        "--loglevel=INFO",
      ]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  redisdata:
