services:
  - type: web
    name: saleor-backend
    env: python
    buildCommand: |
      pyenv install 3.12.9 --skip-existing
      pyenv global 3.12.9
      poetry env use 3.12.9
      poetry install --no-root
    startCommand: poetry run gunicorn saleor.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
